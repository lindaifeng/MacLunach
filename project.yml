name: Touch
options:
  minimumXcodeGenVersion: 2.42.0
  # Apple Translation 的系统下载面板会参考调用应用的本地化回退语言。
  # 主应用面向中文用户，不能因工程默认 en 而让系统面板回退到英文。
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: '14.0'
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  TouchKit:
    path: Packages/TouchKit
targets:
  Touch:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - TouchApp
    dependencies:
      - package: TouchKit
        product: TouchFeatureAPI
      - package: TouchKit
        product: TouchCore
      - package: TouchKit
        product: FinderFeature
      - package: TouchKit
        product: ScreenshotFeature
      - package: TouchKit
        product: SuperRightFeature
      - package: TouchKit
        product: DailyTaskFeature
      - package: TouchKit
        product: PomodoroFeature
      - package: TouchKit
        product: HolidayCalendarFeature
      - package: TouchKit
        product: MarkdownPreviewFeature
      - package: TouchKit
        product: ParserToolsFeature
      - package: TouchKit
        product: ClipboardFeature
      - package: TouchKit
        product: TranslationFeature
      - package: TouchKit
        product: OCRFeature
      - target: ScreenshotService
        embed: true
      - target: FileActionService
        embed: true
      - target: FinderExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.touch.launcher
        PRODUCT_NAME: 一念
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 保留既有模块名，避免对测试及内部 Swift 导入造成无关迁移。
        PRODUCT_MODULE_NAME: 触达
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TouchApp/Info.plist
        # 使用稳定 Apple Development 身份，避免 ad-hoc 签名每次构建改变
        # designated requirement，导致屏幕录制 TCC 授权失效。
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: Config/Touch.entitlements
        # Xcode 16 为中文 PRODUCT_NAME 生成 *.debug.dylib 时会使外层资源签名校验失败。
        # 关闭调试 dylib 注入，普通断点调试不受影响。
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Debug:
          # Debug 不启用 App Group；系统 Translation 需要的应用身份描述文件
          # 由 Scripts/test-super-right.sh 在本地构建时通过自动签名生成。
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_ENTITLEMENTS: Config/Touch.Debug.entitlements
    scheme:
      testTargets:
        - TouchTests
        - TouchUITests
  ScreenshotService:
    type: xpc-service
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: Services/ScreenshotService
        excludes:
          - Info.plist
    info:
      path: Services/ScreenshotService/Info.plist
      properties:
        XPCService:
          RunLoopType: NSRunLoop
          ServiceType: Application
    dependencies:
      - package: TouchKit
        product: ScreenshotServiceProtocol
      - package: TouchKit
        product: ScreenshotServiceCore
      - package: TouchKit
        product: ScreenshotFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.touch.launcher.ScreenshotService
        PRODUCT_NAME: ScreenshotService
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
  FileActionService:
    type: xpc-service
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: Services/FileActionService
        excludes:
          - Info.plist
          - FileActionService.entitlements
          - FileActionService.Debug.entitlements
    info:
      path: Services/FileActionService/Info.plist
      properties:
        XPCService:
          RunLoopType: NSRunLoop
          ServiceType: Application
    dependencies:
      - package: TouchKit
        product: FileActionServiceProtocol
      - package: TouchKit
        product: FileActionServiceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.touch.launcher.FileActionService
        PRODUCT_NAME: FileActionService
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: Services/FileActionService/FileActionService.entitlements
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_ENTITLEMENTS: Services/FileActionService/FileActionService.Debug.entitlements
  FinderExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: Extensions/FinderExtension
        excludes:
          - Info.plist
          - FinderExtension.entitlements
          - FinderExtension.Debug.entitlements
    info:
      path: Extensions/FinderExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    dependencies:
      - package: TouchKit
        product: FileActionServiceProtocol
      - package: TouchKit
        product: SuperRightFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.touch.launcher.FinderExtension
        PRODUCT_NAME: FinderExtension
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: Extensions/FinderExtension/FinderExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_ENTITLEMENTS: Extensions/FinderExtension/FinderExtension.Debug.entitlements
  TouchTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - TouchTests
    dependencies:
      - target: Touch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.touch.launcher.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/一念.app/Contents/MacOS/一念
        BUNDLE_LOADER: $(TEST_HOST)
  TouchUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - TouchUITests
    dependencies:
      - target: Touch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.touch.launcher.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
