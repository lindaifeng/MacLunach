name: Touch
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: '14.0'
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  TouchKit:
    path: Packages/TouchKit
targets:
  Touch:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - TouchApp
    dependencies:
      - package: TouchKit
        product: TouchFeatureAPI
      - package: TouchKit
        product: TouchCore
      - package: TouchKit
        product: FinderFeature
      - package: TouchKit
        product: ScreenshotFeature
      - package: TouchKit
        product: SuperRightFeature
      - target: ScreenshotService
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.touch.launcher
        PRODUCT_NAME: 触达
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets:
        - TouchTests
        - TouchUITests
  ScreenshotService:
    type: xpc-service
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: Services/ScreenshotService
        excludes:
          - Info.plist
    info:
      path: Services/ScreenshotService/Info.plist
      properties:
        XPCService:
          RunLoopType: NSRunLoop
          ServiceType: Application
    dependencies:
      - package: TouchKit
        product: ScreenshotServiceProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.touch.launcher.ScreenshotService
        PRODUCT_NAME: ScreenshotService
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
  TouchTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - TouchTests
    dependencies:
      - target: Touch
      - package: TouchKit
        product: ScreenshotFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.touch.launcher.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/触达.app/Contents/MacOS/触达
        BUNDLE_LOADER: $(TEST_HOST)
  TouchUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - TouchUITests
    dependencies:
      - target: Touch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.touch.launcher.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
